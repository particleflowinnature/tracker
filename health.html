<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Health, Exercise & Diet Dashboard</title>
<style>
  /* ==========================================================================
     Design Tokens & Base Reset (Zero external dependencies, offline-ready)
     ========================================================================== */
  :root {
    --bg: #f4f7f8;
    --surface: #ffffff;
    --surface-alt: #f8fafc;
    --ink: #0f172a;
    --ink-soft: #334155;
    --mute: #64748b;
    --border: #e2e8f0;
    --border-strong: #cbd5e1;

    /* Distinct Emerald/Teal Wellness Palette */
    --teal-900: #134e4a;
    --teal-700: #0f766e;
    --teal-600: #0d9488;
    --teal-500: #14b8a6;
    --teal-100: #ccfbf1;
    --teal-50: #e6f7f5;

    /* Warm Amber Diet/Nutrition Palette */
    --amber-700: #b45309;
    --amber-600: #d97706;
    --amber-500: #f59e0b;
    --amber-100: #fef3c7;
    --amber-50: #fffbeb;

    /* Crimson Clinical Alert Palette */
    --red-700: #b91c1c;
    --red-600: #dc2626;
    --red-100: #fee2e2;
    --red-50: #fef2f2;

    /* Sky Hydration Palette */
    --sky-600: #0284c7;
    --sky-500: #0ea5e9;
    --sky-100: #e0f2fe;

    --radius-lg: 16px;
    --radius-md: 12px;
    --radius-sm: 8px;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
    --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.06), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
    --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.12);
    --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { color-scheme: light; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.5;
    padding-bottom: calc(36px + env(safe-area-inset-bottom));
    overflow-x: hidden;
  }

  h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -0.015em; color: var(--ink); }
  h2 { font-size: 1.125rem; }
  h3 { font-size: 0.98rem; }
  p { margin: 0; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }

  /* Focus accessibility */
  :focus-visible { outline: 2.5px solid var(--teal-600); outline-offset: 2px; }

  /* Layout Container */
  .container {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* ==========================================================================
     Sticky Top Navigation Bar
     ========================================================================== */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding-top: env(safe-area-inset-top);
  }

  .topbar-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    min-height: 64px;
    padding: 10px 0;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--teal-700), var(--teal-500));
    color: #fff;
    display: grid;
    place-items: center;
    box-shadow: 0 3px 10px rgba(15, 118, 110, 0.25);
    flex-shrink: 0;
  }

  .brand-title {
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.2;
  }

  .pill-badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--teal-50);
    color: var(--teal-700);
    border: 1px solid var(--teal-100);
  }

  .pill-badge.amber { background: var(--amber-100); color: var(--amber-700); border-color: #fde68a; }
  .pill-badge.red { background: var(--red-100); color: var(--red-700); border-color: #fecaca; }
  .pill-badge.sky { background: var(--sky-100); color: var(--sky-600); border-color: #bae6fd; }
  .pill-badge.slate { background: #f1f5f9; color: var(--ink-soft); border-color: var(--border); }

  .top-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .date-nav {
    display: flex;
    align-items: center;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 2px;
    gap: 2px;
  }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-soft);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }

  .icon-btn:hover { background: #e2e8f0; color: var(--ink); }
  .icon-btn.bordered { border-color: var(--border); background: var(--surface); }
  .icon-btn.bordered:hover { border-color: var(--teal-500); color: var(--teal-700); background: var(--teal-50); }

  .date-picker-wrap {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 10px;
    height: 38px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .date-picker-wrap:hover { background: #e2e8f0; }

  .date-display {
    font-weight: 600;
    font-size: 0.9rem;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .date-native {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  /* ==========================================================================
     Sub-header Pill Tabs & Global Alert Banner
     ========================================================================== */
  .subnav {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 0;
  }

  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
    padding: 9px 16px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--mute);
    font-weight: 600;
    font-size: 0.9rem;
    min-height: 42px;
    transition: all 0.15s ease;
  }

  .tab-btn:hover { background: var(--surface-alt); color: var(--ink); }
  .tab-btn.active {
    background: var(--teal-700);
    color: #fff;
    box-shadow: 0 2px 8px rgba(15, 118, 110, 0.25);
  }

  .alert-banner {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--red-50);
    border: 1px solid #fca5a5;
    border-left: 5px solid var(--red-600);
    color: var(--red-700);
    border-radius: var(--radius-md);
    padding: 14px 16px;
    margin: 16px 0 4px;
    box-shadow: var(--shadow-sm);
  }

  .alert-banner strong { font-weight: 700; display: block; margin-bottom: 2px; }

  /* ==========================================================================
     7-Day Compact Week Strip
     ========================================================================== */
  .week-strip {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
    margin: 16px 0;
  }

  .week-day {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 8px 4px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-height: 64px;
    transition: all 0.15s ease;
    box-shadow: var(--shadow-sm);
  }

  .week-day:hover { border-color: var(--teal-500); transform: translateY(-1px); }
  .week-day.active {
    border-color: var(--teal-700);
    background: var(--teal-50);
    box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
  }
  .week-day.has-sym { border-color: #fca5a5; }

  .week-day .dow { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: var(--mute); letter-spacing: 0.04em; }
  .week-day.active .dow { color: var(--teal-700); }
  .week-day .dom { font-size: 0.95rem; font-weight: 700; line-height: 1; }
  .week-day .mini-bar {
    width: 80%;
    height: 5px;
    border-radius: 99px;
    background: #e2e8f0;
    overflow: hidden;
    margin-top: 2px;
  }
  .week-day .mini-bar span {
    display: block;
    height: 100%;
    background: var(--teal-600);
    border-radius: 99px;
    transition: width 0.3s ease;
  }

  /* ==========================================================================
     Cards, Grids & Reusable UI Components
     ========================================================================== */
  .grid-2 {
    display: grid;
    grid-template-columns: 1.55fr 1fr;
    gap: 16px;
    align-items: start;
  }

  .grid-even {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
    align-items: start;
  }

  .kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 16px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    box-shadow: var(--shadow-md);
    margin-bottom: 16px;
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }

  .card-title-wrap {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .card-icon {
    width: 32px;
    height: 32px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    background: var(--teal-50);
    color: var(--teal-700);
    flex-shrink: 0;
  }
  .card-icon.amber { background: var(--amber-100); color: var(--amber-700); }
  .card-icon.red { background: var(--red-100); color: var(--red-700); }
  .card-icon.sky { background: var(--sky-100); color: var(--sky-600); }

  .mute { color: var(--mute); font-size: 0.85rem; }

  .progress-track {
    height: 9px;
    border-radius: 99px;
    background: #e2e8f0;
    overflow: hidden;
    margin: 8px 0;
  }
  .progress-fill {
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--teal-700), var(--teal-500));
    transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .progress-fill.amber { background: linear-gradient(90deg, var(--amber-600), var(--amber-500)); }
  .progress-fill.sky { background: linear-gradient(90deg, var(--sky-600), var(--sky-500)); }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 42px;
    padding: 8px 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-weight: 600;
    font-size: 0.88rem;
    transition: all 0.15s ease;
  }
  .btn:hover { background: var(--surface-alt); border-color: var(--border-strong); }
  .btn-primary {
    background: var(--teal-700);
    border-color: var(--teal-700);
    color: #fff;
  }
  .btn-primary:hover { background: var(--teal-900); border-color: var(--teal-900); }
  .btn-amber {
    background: var(--amber-600);
    border-color: var(--amber-600);
    color: #fff;
  }
  .btn-amber:hover { background: var(--amber-700); border-color: var(--amber-700); }
  .btn-danger {
    background: var(--red-50);
    border-color: #fecaca;
    color: var(--red-700);
  }
  .btn-danger:hover { background: var(--red-100); border-color: #f87171; }
  .btn-sm { min-height: 34px; padding: 5px 11px; font-size: 0.82rem; border-radius: var(--radius-sm); }

  /* ==========================================================================
     Tab 1: Exercise, Phases, Set Chips & Run-Walk Timer
     ========================================================================== */
  .phase-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    padding: 4px 0 12px;
    scrollbar-width: none;
  }
  .phase-bar::-webkit-scrollbar { display: none; }

  .phase-pill {
    white-space: nowrap;
    min-height: 38px;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 0.84rem;
    transition: all 0.15s ease;
  }
  .phase-pill:hover { border-color: var(--teal-500); color: var(--teal-700); }
  .phase-pill.active {
    background: var(--teal-50);
    border-color: var(--teal-700);
    color: var(--teal-900);
  }

  .exercise-item {
    padding: 13px 0;
    border-top: 1px solid var(--border);
  }
  .exercise-item:first-of-type { border-top: none; padding-top: 4px; }
  .exercise-item:last-of-type { padding-bottom: 2px; }

  .ex-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .ex-name { font-weight: 600; font-size: 0.96rem; color: var(--ink); }
  .ex-load-input {
    width: 112px;
    padding: 5px 9px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    background: var(--surface-alt);
    font-size: 0.82rem;
    color: var(--ink);
    transition: border-color 0.15s, background 0.15s;
  }
  .ex-load-input:focus { background: #fff; border-color: var(--teal-600); outline: none; }

  .chips-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 9px;
  }

  .chip-btn {
    min-height: 44px;
    min-width: 44px;
    padding: 0 14px;
    border-radius: var(--radius-md);
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 0.86rem;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: all 0.15s ease;
  }
  .chip-btn:hover { border-color: var(--teal-500); background: var(--teal-50); color: var(--teal-900); }
  .chip-btn.done {
    background: var(--teal-700);
    border-color: var(--teal-700);
    color: #fff;
    box-shadow: 0 2px 6px rgba(15, 118, 110, 0.22);
  }
  .chip-btn.amber-chip:hover { border-color: var(--amber-500); background: var(--amber-50); color: var(--amber-700); }
  .chip-btn.sky-chip:hover { border-color: var(--sky-500); background: var(--sky-100); color: var(--sky-600); }

  /* Checklist Rows */
  .check-row {
    display: flex;
    align-items: flex-start;
    gap: 11px;
    padding: 10px 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface-alt);
    margin-bottom: 8px;
    cursor: pointer;
    min-height: 46px;
    transition: background 0.15s, border-color 0.15s;
  }
  .check-row:last-child { margin-bottom: 0; }
  .check-row:hover { border-color: var(--teal-500); background: #fff; }
  .check-row.checked { background: var(--teal-50); border-color: var(--teal-100); }
  .check-row.sym-row:hover { border-color: #fca5a5; }
  .check-row.sym-row.checked { background: var(--red-50); border-color: #fca5a5; }

  .check-row input[type="checkbox"] {
    width: 20px;
    height: 20px;
    margin-top: 2px;
    accent-color: var(--teal-700);
    flex-shrink: 0;
    cursor: pointer;
  }
  .check-row.sym-row input[type="checkbox"] { accent-color: var(--red-600); }
  .check-row.checked span.strike { color: var(--mute); text-decoration: line-through; }

  /* Run-Walk Circular Timer */
  .timer-card {
    text-align: center;
    transition: background 0.3s ease, border-color 0.3s ease;
  }
  .timer-card.state-run { background: linear-gradient(180deg, #ffffff 0%, var(--teal-50) 100%); border-color: var(--teal-100); }
  .timer-card.state-walk { background: linear-gradient(180deg, #ffffff 0%, var(--amber-50) 100%); border-color: #fde68a; }

  .timer-ring-wrap {
    position: relative;
    width: 206px;
    height: 206px;
    margin: 14px auto;
  }
  .timer-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .timer-track { fill: none; stroke: #e2e8f0; stroke-width: 11; }
  .timer-progress { fill: none; stroke: var(--teal-600); stroke-width: 11; stroke-linecap: round; transition: stroke-dashoffset 0.35s linear, stroke 0.25s ease; }
  .timer-card.state-walk .timer-progress { stroke: var(--amber-500); }

  .timer-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .timer-phase { font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--teal-700); }
  .timer-card.state-walk .timer-phase { color: var(--amber-700); }
  .timer-clock { font-size: 2.65rem; font-weight: 800; line-height: 1.05; letter-spacing: -0.03em; margin: 2px 0; }
  .timer-step { font-size: 0.8rem; color: var(--mute); font-weight: 600; }

  /* ==========================================================================
     Tab 2: Diet, Presets, Meal Log & Hydration
     ========================================================================== */
  .macro-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 12px 0;
  }
  .macro-box {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 12px;
  }
  .macro-val { font-size: 1.45rem; font-weight: 800; line-height: 1.15; margin: 2px 0; }

  .preset-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }

  .preset-chip {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    padding: 8px 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface-alt);
    text-align: left;
    min-height: 48px;
    transition: all 0.15s ease;
  }
  .preset-chip:hover {
    border-color: var(--amber-500);
    background: var(--amber-50);
    transform: translateY(-1px);
  }
  .preset-chip strong { font-size: 0.85rem; color: var(--ink); font-weight: 600; }
  .preset-chip span { font-size: 0.74rem; color: var(--mute); }

  .meal-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .meal-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface-alt);
  }
  .meal-meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .meal-title { font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .meal-macros { font-size: 0.8rem; color: var(--mute); }

  /* Forms */
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(125px, 1fr));
    gap: 10px;
  }
  .field label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--mute);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .input, select.input, textarea.input {
    width: 100%;
    min-height: 42px;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    background: var(--surface);
    color: var(--ink);
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input:focus {
    outline: none;
    border-color: var(--teal-600);
    box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
  }
  textarea.input { min-height: 86px; resize: vertical; }

  /* Hydration Visual */
  .water-readout {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .water-big { font-size: 2rem; font-weight: 800; color: var(--sky-600); line-height: 1; }

  /* ==========================================================================
     Tab 3: Vitals, Sparklines & Clearances
     ========================================================================== */
  .spark-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .spark-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 12px;
    border-radius: var(--radius-md);
    background: var(--surface-alt);
    border: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .data-table-wrap { overflow-x: auto; margin-top: 10px; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
  table.data-table th, table.data-table td {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    white-space: nowrap;
  }

     Toast & Custom Modal (No alert()/confirm())

<script>
(function() {
  'use strict';

  /* ==========================================================================
     1. Persistence & Backward-Compatible State (Key: nsgct-tracker-v1)
     ========================================================================== */
  const STORAGE_KEY = 'nsgct-tracker-v1';

  function loadState() {
    let raw = null;
    try {
      raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
    } catch (e) {
      raw = null;
    }
    const s = (raw && typeof raw === 'object') ? raw : {};
    s.days = s.days && typeof s.days === 'object' ? s.days : {};
    s.vit = Array.isArray(s.vit) ? s.vit : [];
    s.gates = s.gates && typeof s.gates === 'object' ? s.gates : {};
    if (s.phase == null) s.phase = 1;
    s.customMeds = Array.isArray(s.customMeds) ? s.customMeds : [];
    if (s.manualProtTarget === undefined) s.manualProtTarget = '';
    return s;
  }

  let S = loadState();
  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
    } catch (e) {
      showToast('Could not save to localStorage.', true);
    }
  }

  /* Date Helpers */
  const toISO = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const parseISO = (str) => new Date(str + 'T00:00:00');
  const shiftDate = (str, days) => {
    const d = parseISO(str);
    d.setDate(d.getDate() + days);
    return toISO(d);
  };
  const todayISO = () => toISO(new Date());

  let curDate = todayISO();
  let activeTab = 'exercise';
  let selectedMealSlot = 'Lunch';

  /* Ensure day record exists and preserves backward compatibility */
  function getDay(dStr) {
    if (!S.days[dStr]) {
      S.days[dStr] = {
        ex: {},
        hab: {},
        sym: {},
        water: 0,
        prot: 0,
        note: '',
        meals: [],
        weights: {}
      };
    } else {
      const D = S.days[dStr];
      if (!D.ex) D.ex = {};
      if (!D.hab) D.hab = {};
      if (!D.sym) D.sym = {};
      if (typeof D.water !== 'number') D.water = 0;
      if (typeof D.prot !== 'number') D.prot = 0;
      if (typeof D.note !== 'string') D.note = '';
      if (!Array.isArray(D.meals)) D.meals = [];
      if (!D.weights || typeof D.weights !== 'object') D.weights = {};
    }
    return S.days[dStr];
  }

  /* ==========================================================================
     2. Clinical & Domain Constants
     ========================================================================== */
  const PHASES = [
    'Walk & Mobility',
    'Foundation',
    'Build',
    'Progress'
  ];
  const REP_RANGE = { 1: '10–12', 2: '8–10', 3: '6–8' };

  const L = (id, n) => ({ id, n, t: 'lift' });
  const I = (id, n) => ({ id, n, t: 'iso' });
  const O = (id, n, note) => ({ id, n, t: 'one', note });

  const WU = O('wu', 'Warm-up: 5 min walk and joint mobility');
  const CD = O('cd', 'Cool-down: 3 min slow nasal breathing');

  function getPlan(dStr) {
    const w = parseISO(dStr).getDay(); // 0=Sun .. 6=Sat
    const p = S.phase;
    const sA = [
      L('sq', 'Goblet squat or leg press'),
      L('pu', 'Incline push-up or chest press'),
      L('row', 'Seated row'),
      L('hip', 'Glute bridge or light hip hinge'),
      I('db', 'Dead bug'),
      I('sp', 'Side plank (knees down is fine)')
    ];
    const sB = [
      L('su', 'Step-ups or split squat'),
      L('sh', 'Light shoulder press'),
      L('lat', 'Lat pulldown'),
      L('rdl', 'Hip hinge'),
      I('bd', 'Bird-dog')
    ];
    if (p >= 2) sB.push(L('car', 'Light loaded carry'));

    const walkMob = [O('w0', 'Easy walk 20–30 min'), O('mob', 'Gentle mobility 10 min')];

    if (w === 1 || w === 4) {
      if (p === 0) return { title: 'Walk and mobility', items: [...walkMob, CD], cardio: false };
      return {
        title: w === 1 ? 'Strength A' : 'Strength B',
        items: [WU, ...(w === 1 ? sA : sB), CD],
        cardio: false
      };
    }
    if (w === 2) {
      return {
        title: 'Zone 2 cardio',
        cardio: p > 0,
        items: [
          O('z2', p ? 'Brisk walk or run-walk, 30–40 min' : 'Brisk walk 30 min', 'You should be able to hold a conversation'),
          CD
        ]
      };
    }
    if (w === 3) {
      return {
        title: 'Yoga, balance and breathing',
        cardio: false,
        items: [
          O('y1', 'Cat-cow and child’s pose'),
          O('y2', 'Hip flexor and hamstring stretches'),
          O('y3', 'Gentle sun salutations (only once your core is cleared)'),
          O('b1', 'Single-leg stand, 3 × 20 s each side'),
          O('b2', 'Tandem walk, 3 passes'),
          O('b3', 'Slow nasal breathing 5 min')
        ]
      };
    }
    if (w === 5) {
      return {
        title: 'Easy walk or cycle',
        cardio: false,
        items: [
          O('ez', 'Easy walk or cycle, 30 min', 'Class at 17:00, so go after 18:30'),
          CD
        ]
      };
    }
    if (w === 6) {
      return {
        title: 'Long easy session',
        cardio: p > 0,
        items: [
          O('lg', 'Walk, cycle or run-walk, 40–60 min', 'Around 6:30 or 17:30 to avoid heat'),
          CD
        ]
      };
    }
    return {
      title: 'Restorative and review',
      cardio: false,
      items: [
        O('rb', 'Slow nasal breathing 5 min'),
        O('rs', 'Restorative poses 15 min'),
        O('rv', 'Weekly review: log your vitals in Health & Vitals tab')
      ]
    };
  }

  function numChips(it) {
    if (it.t === 'lift') return S.phase === 1 ? 2 : 3;
    if (it.t === 'iso') return S.phase <= 1 ? 2 : 3;
    return 1;
  }

  /* Strictly Exercise/Recovery micro-habits (no PhD overlap) */
  const MOVE_HABITS = [
    ['w1', 'Walk 10 min after lunch'],
    ['w2', 'Walk 10 min after dinner'],
    ['wd', 'Wind-down breathing before bed']
  ];

  /* Clinical Supplements & Medications */
  const CORE_MEDS = [
    ['b12', 'B12 taken as prescribed'],
    ['vd', 'Vitamin D taken as prescribed']
  ];

  /* Exact 8 Clinical Red-Flag Symptoms */
  const SYMPTOMS = [
    'New cough or breathlessness',
    'Chest pain, palpitations or fainting',
    'One leg swollen or painful',
    'Worse numbness or tingling',
    'Ringing in ears or hearing change',
    'Bulge at the incision',
    'New back or abdominal pain',
    'New lump or testicular change'
  ];

  /* Exact 5 Pre-Training Clearances & Surveillance Gates */
  const GATES = [
    ['g1', 'Surgeon clearance on lifting and core work'],
    ['g2', 'Oncologist okay for running'],
    ['g3', 'Baseline BP, heart rate, waist and weight logged'],
    ['g4', 'B12 and vitamin D plan agreed with physician'],
    ['g5', 'Surveillance dates (AFP, β-hCG, LDH, scans) added to calendar']
  ];

  /* Vegetarian & Indian Quick-Add Meal Presets */
  const MEAL_PRESETS = [
    { name: 'Paneer (100g)', p: 18, c: 265, f: 0 },
    { name: 'Dal / Rajma / Chole bowl', p: 10, c: 180, f: 6 },
    { name: 'Soya Chunks (50g dry)', p: 26, c: 172, f: 6 },
    { name: 'Curd / Greek Yogurt (200g)', p: 10, c: 130, f: 0 },
    { name: 'Whey / Plant Protein Scoop', p: 24, c: 120, f: 1 },
    { name: 'Moong Sprouts / Chana (100g)', p: 8, c: 110, f: 6 },
    { name: 'Besan Chilla (2 pcs)', p: 12, c: 240, f: 5 },
    { name: 'Chia / Sabja Seeds (1 tbsp)', p: 3, c: 60, f: 5 },
    { name: 'Whole Wheat Roti (2) + Sabzi', p: 7, c: 260, f: 6 },
    { name: 'Tender Coconut Water', p: 1, c: 45, f: 0 },
    { name: 'Fresh Fruit Bowl', p: 1, c: 90, f: 4 }
  ];

  /* ==========================================================================
     3. Calculations & Aggregations
     ========================================================================== */
  function sortedVitals() {
    return S.vit.slice().sort((a, b) => (a.d < b.d ? -1 : a.d > b.d ? 1 : 0));
  }

  function latestWeight() {
    const list = sortedVitals().filter(v => v.w != null && v.w !== '');
    return list.length ? Number(list[list.length - 1].w) : null;
  }

  function getProteinTargets() {
    const manual = Number(S.manualProtTarget);
    if (manual > 0) {
      return { min: manual, max: manual, label: `${manual} g (manual target)`, weight: latestWeight(), isManual: true };
    }
    const w = latestWeight();
    if (w) {
      const min = Math.round(w * 1.2);
      const max = Math.round(w * 1.6);
      return { min, max, label: `${min}–${max} g (1.2–1.6 g/kg at ${w} kg)`, weight: w, isManual: false };
    }
    return { min: 80, max: 100, label: null, weight: null, isManual: false };
  }

  function getDayMacros(dStr) {
    const D = S.days[dStr];
    if (!D) return { p: 0, c: 0, f: 0 };
    const meals = Array.isArray(D.meals) ? D.meals : [];
    const mealP = meals.reduce((sum, m) => sum + (Number(m.p) || 0), 0);
    const mealC = meals.reduce((sum, m) => sum + (Number(m.c) || 0), 0);
    const mealF = meals.reduce((sum, m) => sum + (Number(m.f) || 0), 0);
    const quickP = Number(D.prot) || 0;
    return {
      p: Math.max(0, Math.round(mealP + quickP)),
      c: Math.round(mealC),
      f: Math.round(mealF)
    };
  }

  function exercisePct(dStr) {
    const D = S.days[dStr];
    if (!D) return 0;
    let total = 0, done = 0;
    getPlan(dStr).items.forEach(it => {
      const n = numChips(it);
      for (let i = 0; i < n; i++) {
        total++;
        if (D.ex && D.ex[it.id + '_' + i]) done++;
      }
    });
    MOVE_HABITS.forEach(h => {
      total++;
      if (D.hab && D.hab[h[0]]) done++;
    });
    return total ? Math.round((done / total) * 100) : 0;
  }

  function dietPct(dStr) {
    const D = S.days[dStr];
    if (!D) return 0;
    const macros = getDayMacros(dStr);
    const pt = getProteinTargets().min || 80;
    const pRatio = Math.min(1, macros.p / pt);
    const wRatio = Math.min(1, (D.water || 0) / 2.5);
    return Math.round(((pRatio + wRatio) / 2) * 100);
  }

  function combinedPct(dStr) {
    return Math.round((exercisePct(dStr) * 0.6) + (dietPct(dStr) * 0.4));
  }

  function hasRedFlag(dStr) {
    const D = S.days[dStr];
    if (!D || !D.sym) return false;
    return SYMPTOMS.some((_, i) => Boolean(D.sym[i]));
  }

  function esc(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  /* ==========================================================================
     4. Run-Walk Interval Timer Engine (Web Audio 880 Hz + Vibration + SVG Ring)
     ========================================================================== */
  const TIMER_PRESETS = [
    [60, 120, 8],
    [120, 120, 6],
    [180, 60, 5],
    [1200, 0, 1]
  ];

  const timerLabel = (s) => s[1] ? `${s[0] / 60} min run, ${s[1] / 60} min walk × ${s[2]}` : '20 min continuous run';
  const formatMMSS = (sec) => `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;

  const T = {
    step: 0,
    seq: [],
    idx: 0,
    left: 0,
    iv: null,
    audioCtx: null
  };

  function buildTimer() {
    T.seq = [];
    const [runS, walkS, reps] = TIMER_PRESETS[T.step];
    for (let r = 0; r < reps; r++) {
      T.seq.push(['Run', runS]);
      if (walkS > 0) T.seq.push(['Walk', walkS]);
    }
    T.idx = 0;
    T.left = T.seq[0][1];
  }

  function playBeep() {
    try {
      T.audioCtx = T.audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (T.audioCtx.state === 'suspended') T.audioCtx.resume();
      const osc = T.audioCtx.createOscillator();
      const gain = T.audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.22, T.audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, T.audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(T.audioCtx.destination);
      osc.start();
      osc.stop(T.audioCtx.currentTime + 0.26);
    } catch (e) {}
    try {
      if (navigator.vibrate) navigator.vibrate(200);
    } catch (e) {}
  }

  function timerTick() {
    T.left--;
    if (T.left <= 0) {
      T.idx++;
      playBeep();
      if (T.idx >= T.seq.length) {
        clearInterval(T.iv);
        T.iv = null;
        updateTimerDOM();
        return;
      }
      T.left = T.seq[T.idx][1];
    }
    updateTimerDOM();
  }

  function getTimerMarkup() {
    const done = T.idx >= T.seq.length;
    const current = done ? ['Done', 1] : T.seq[T.idx];
    const totalSec = current[1] || 1;
    const ratio = done ? 0 : Math.max(0, Math.min(1, T.left / totalSec));
    const R = 88;
    const C = 2 * Math.PI * R;
    const offset = C * (1 - ratio);
    const stateClass = done ? '' : (current[0] === 'Run' ? 'state-run' : 'state-walk');

    return `
      <div class="card timer-card ${stateClass}" id="timer-card">
        <div class="card-header" style="margin-bottom:8px;">
          <div class="card-title-wrap">
            <div class="card-icon ${current[0] === 'Walk' ? 'amber' : ''}">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><polyline points="12 9 12 13 15 15"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/><line x1="12" y1="1" x2="12" y2="3"/></svg>
            </div>
            <h2>Run-Walk Timer</h2>
          </div>
          <span class="pill-badge ${current[0] === 'Walk' ? 'amber' : ''}">${done ? 'Completed' : current[0]}</span>
        </div>

        <select id="timer-preset" class="input" aria-label="Interval preset">
          ${TIMER_PRESETS.map((s, i) => `<option value="${i}" ${i === T.step ? 'selected' : ''}>${timerLabel(s)}</option>`).join('')}
        </select>

        <div class="timer-ring-wrap">
          <svg class="timer-svg" viewBox="0 0 200 200" aria-hidden="true">
            <circle class="timer-track" cx="100" cy="100" r="${R}"></circle>
            <circle class="timer-progress" cx="100" cy="100" r="${R}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"></circle>
          </svg>
          <div class="timer-center">
            <div class="timer-phase">${done ? 'Finished' : current[0]}</div>
            <div class="timer-clock num">${done ? '0:00' : formatMMSS(T.left)}</div>
            <div class="timer-step">${done ? 'Cool down slowly' : `${current[0]} · ${T.idx + 1} of ${T.seq.length}`}</div>
          </div>
        </div>

        <div style="display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
          <button class="btn btn-primary" data-action="timer-toggle">${T.iv ? 'Pause' : 'Start'}</button>
          <button class="btn" data-action="timer-skip" ${done ? 'disabled' : ''}>Skip</button>
          <button class="btn" data-action="timer-reset">Reset</button>
        </div>
        <p class="mute" style="font-size:0.8rem;">Keep it at a pace where you can talk. Stop for chest tightness or unusual breathlessness.</p>
      </div>
    `;
  }

  function updateTimerDOM() {
    const slot = document.getElementById('timer-slot');
    if (slot) slot.innerHTML = getTimerMarkup();
  }

  /* ==========================================================================
     5. SVG Sparklines & Analytics Trend Charts
     ========================================================================== */
  function renderSparkline(key, unit) {
    const vals = sortedVitals().filter(v => v[key] != null && v[key] !== '').slice(-12);
    if (vals.length < 2) {
      return `<span class="mute">Log at least 2 entries to see trend</span>`;
    }
    const nums = vals.map(v => Number(v[key]));
    const min = Math.min(...nums);
    const max = Math.max(...nums);
    const range = (max - min) || 1;
    const W = 170, H = 36, pad = 4;
    const pts = nums.map((n, i) => {
      const x = pad + (i * ((W - pad * 2) / (nums.length - 1)));
      const y = (H - pad) - ((n - min) / range) * (H - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    const last = nums[nums.length - 1];
    const first = nums[0];
    return `
      <div style="display:flex;align-items:center;gap:10px;">
        <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-label="${key} sparkline">
          <polyline points="${pts}" fill="none" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="mute num" style="font-weight:600;color:var(--ink-soft);">${first} → ${last}${unit}</span>
      </div>
    `;
  }

  function renderFullChart(key, title, unit, color) {
    const vals = sortedVitals().filter(v => v[key] != null && v[key] !== '').slice(-20);
    if (vals.length < 2) {
      return `
        <div class="chart-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <h3>${title}</h3>
            <span class="mute">${vals.length === 1 ? `Latest: ${vals[0][key]} ${unit}` : 'No data yet'}</span>
          </div>
          <p class="mute" style="padding:26px 0;text-align:center;">Log at least 2 ${title.toLowerCase()} entries in Health &amp; Vitals to plot trends.</p>
        </div>
      `;
    }

    const nums = vals.map(v => Number(v[key]));
    const min = Math.min(...nums);
    const max = Math.max(...nums);
    const latest = nums[nums.length - 1];
    const range = (max - min) || 1;
    const W = 400, H = 140, padX = 16, padY = 18;

    const coords = vals.map((v, i) => {
      const x = padX + (i * ((W - padX * 2) / (vals.length - 1)));
      const y = (H - padY) - ((Number(v[key]) - min) / range) * (H - padY * 2);
      return { x, y, val: v[key], d: v.d };
    });

    const polyPts = coords.map(c => `${c.x.toFixed(1)},${c.y.toFixed(1)}`).join(' ');
    const areaPts = `${coords[0].x.toFixed(1)},${H - padY} ${polyPts} ${coords[coords.length - 1].x.toFixed(1)},${H - padY}`;

    return `
      <div class="chart-card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:10px;">
          <h3>${title}</h3>
          <div style="display:flex;gap:10px;font-size:0.78rem;" class="num">
            <span class="mute">Min: <strong>${min}</strong></span>
            <span class="mute">Max: <strong>${max}</strong></span>
            <span class="pill-badge">Latest: ${latest} ${unit}</span>
          </div>
        </div>
        <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${title} trend chart">
          <line x1="${padX}" y1="${padY}" x2="${W - padX}" y2="${padY}" stroke="#e2e8f0" stroke-dasharray="3 3"/>
          <line x1="${padX}" y1="${H / 2}" x2="${W - padX}" y2="${H / 2}" stroke="#e2e8f0" stroke-dasharray="3 3"/>
          <line x1="${padX}" y1="${H - padY}" x2="${W - padX}" y2="${H - padY}" stroke="#cbd5e1"/>
          <polygon points="${areaPts}" fill="${color}" fill-opacity="0.1"/>
          <polyline points="${polyPts}" fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          ${coords.map(c => `
            <circle cx="${c.x.toFixed(1)}" cy="${c.y.toFixed(1)}" r="4.2" fill="#fff" stroke="${color}" stroke-width="2.2">
              <title>${c.d}: ${c.val} ${unit}</title>
            </circle>
          `).join('')}
        </svg>
        <div style="display:flex;justify-content:space-between;font-size:0.74rem;color:var(--mute);margin-top:4px;">
          <span>${vals[0].d}</span>
          <span>${vals[vals.length - 1].d}</span>
        </div>
      </div>
    `;
  }

  /* ==========================================================================

  function renderHeader() {
    const dObj = parseISO(curDate);
    const fmt = dObj.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
    const isToday = curDate === todayISO();
    document.getElementById('date-label').innerHTML = `${fmt}${isToday ? ' <span class="pill-badge" style="font-size:0.65rem;padding:1px 6px;">Today</span>' : ''}`;
    document.getElementById('date-input').value = curDate;

    document.querySelectorAll('#nav-tabs .tab-btn').forEach(btn => {
      const isAct = btn.dataset.tab === activeTab;
      btn.classList.toggle('active', isAct);
      btn.setAttribute('aria-selected', isAct ? 'true' : 'false');
    });
  }

  function renderGlobalAlert() {
    const el = document.getElementById('global-alert');
    if (hasRedFlag(curDate)) {
      el.innerHTML = `
        <div class="alert-banner" role="alert">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px;"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>

  function renderWeekStrip() {
    const wrap = document.getElementById('week-strip-wrap');
    if (activeTab === 'analytics') {
      wrap.innerHTML = '';
      return;
    }
    const dowIdx = (parseISO(curDate).getDay() + 6) % 7; // Mon=0..Sun=6
    const mon = shiftDate(curDate, -dowIdx);
    const labels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

    wrap.innerHTML = `
      <div class="week-strip" role="navigation" aria-label="Current week">
        ${labels.map((lbl, i) => {
          const d = shiftDate(mon, i);
          const pct = combinedPct(d);
          const isCur = d === curDate;
          const symFlag = hasRedFlag(d);
          return `
            <button class="week-day ${isCur ? 'active' : ''} ${symFlag ? 'has-sym' : ''}" data-action="go-date" data-val="${d}" title="${d} · ${pct}% complete">
              <span class="dow">${lbl}</span>

              <span class="mini-bar"><span style="width:${pct}%"></span></span>
            </button>
          `;
        }).join('')}
      </div>
    `;
  }

  /* ---- TAB 4: Analytics ---- */
  function renderAnalyticsTab() {
    // 7-day rolling window ending on curDate
    let exSum = 0, protSum = 0, watSum = 0, symFree = 0;
    for (let i = 0; i < 7; i++) {
      const d = shiftDate(curDate, -i);
      exSum += exercisePct(d);
      protSum += getDayMacros(d).p;
      watSum += (S.days[d] && S.days[d].water) ? S.days[d].water : 0;
      if (!hasRedFlag(d)) symFree++;
    }

    const avgEx = Math.round(exSum / 7);
    const avgProt = Math.round(protSum / 7);
    const avgWat = (watSum / 7).toFixed(2);
    const pt = getProteinTargets();

    // 12-week (84-day) Consistency Heatmap ending on Sunday of current week
    const today = todayISO();
    const dowToday = (parseISO(today).getDay() + 6) % 7; // Mon=0..Sun=6
    const endSun = shiftDate(today, 6 - dowToday);
    const startMon = shiftDate(endSun, -(12 * 7 - 1));

    let cellsHTML = '';
    for (let i = 0; i < 84; i++) {
      const d = shiftDate(startMon, i);
      const pct = combinedPct(d);
      let lvl = '';
      if (pct >= 80) lvl = 'hm-l4';
      else if (pct >= 55) lvl = 'hm-l3';
      else if (pct >= 30) lvl = 'hm-l2';
      else if (pct > 0) lvl = 'hm-l1';
      cellsHTML += `<button class="hm-cell ${lvl}" data-action="jump-from-hm" data-val="${d}" title="${d}: ${pct}% adherence (Exercise + Diet)" aria-label="${d}: ${pct}% adherence"></button>`;
    }

    return `
      <div style="margin:14px 0 12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
        <h2>Weekly Analytics</h2>
        <span class="pill-badge slate">7 Days ending ${curDate}</span>
      </div>

      <!-- KPI Grid -->
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-top">
            <span class="pill-badge">Exercise</span>
          </div>
          <div class="kpi-val num">${avgEx}%</div>
          <div class="kpi-sub">7-day avg completion</div>
        </div>

        <div class="kpi-card">
          <div class="kpi-top">
            <span class="pill-badge amber">Protein</span>
          </div>
          <div class="kpi-val num">${avgProt} g</div>
          <div class="kpi-sub">Target: ${pt.min}${pt.max !== pt.min ? '–' + pt.max : ''} g/day</div>
        </div>

        <div class="kpi-card">
          <div class="kpi-top">
            <span class="pill-badge sky">Hydration</span>
          </div>
          <div class="kpi-val num">${avgWat} L</div>
          <div class="kpi-sub">Target: 2.5–3.0 L/day</div>
        </div>

        <div class="kpi-card">
          <div class="kpi-top">
            <span class="pill-badge ${symFree < 7 ? 'red' : ''}">Clinical</span>
          </div>
          <div class="kpi-val num">${symFree} / 7</div>
          <div class="kpi-sub">Symptom-free days</div>
        </div>
      </div>

      <!-- 12-Week Consistency Heatmap -->
      <div class="card">
        <div class="card-header">
          <div class="card-title-wrap">
            <div class="card-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </div>
            <div>
              <h2>12-Week Consistency Heatmap</h2>
              <div class="mute">Combined daily Exercise &amp; Diet adherence. Click any square to inspect that day.</div>
            </div>
          </div>
        </div>
        <div class="heatmap-scroll">
          <div class="heatmap-grid">${cellsHTML}</div>
        </div>
        <div class="hm-legend">
          <span>Less</span>
          <i style="background:#e2e8f0"></i>
          <i class="hm-l1"></i>
          <i class="hm-l2"></i>
          <i class="hm-l3"></i>
          <i class="hm-l4"></i>
          <span>More</span>
        </div>
      </div>

      <!-- Interactive Vitals Trend Charts -->
      <div class="card">
        <div class="card-header">
          <div class="card-title-wrap">
            <div class="card-icon">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
            </div>
            <h2>Vitals Trend Charts</h2>
          </div>
        </div>
        <div class="grid-even">
          ${renderFullChart('w', 'Weight', 'kg', '#0f766e')}
          ${renderFullChart('wa', 'Waist Circumference', 'cm', '#d97706')}
        </div>
        <div style="margin-top:16px;">
          ${renderFullChart('r', 'Resting Heart Rate', 'bpm', '#0284c7')}
        </div>
      </div>
    `;
  }

  function renderApp() {
    renderHeader();
    renderGlobalAlert();
    renderWeekStrip();

    const root = document.getElementById('view-root');
    if (activeTab === 'exercise') root.innerHTML = renderExerciseTab();
    else if (activeTab === 'diet') root.innerHTML = renderDietTab();
    else if (activeTab === 'health') root.innerHTML = renderHealthTab();
    else root.innerHTML = renderAnalyticsTab();
  }

  /* ==========================================================================
     7. Toast & Modal Helpers
     ========================================================================== */
  function showToast(msg, isError = false) {
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = 'toast' + (isError ? ' error' : '');
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  function openModal() {
    document.getElementById('confirm-modal').classList.add('open');
  }
  function closeModal() {
    document.getElementById('confirm-modal').classList.remove('open');
  }

  /* ==========================================================================
     8. Data Export & Import (Backward-Compatible)
     ========================================================================== */
  function exportJSON() {
    const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `health-tracker-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    showToast('Backup exported as JSON.');
  }

  function handleImportFile(file) {
    if (!file) return;
    file.text().then(txt => {
      try {
        const parsed = JSON.parse(txt);
        if (!parsed || typeof parsed !== 'object' || !parsed.days) {
          throw new Error('Invalid format');
        }
        S = {
          days: parsed.days || {},
          vit: Array.isArray(parsed.vit) ? parsed.vit : [],
          gates: parsed.gates || {},
          phase: parsed.phase != null ? parsed.phase : 1,
          customMeds: Array.isArray(parsed.customMeds) ? parsed.customMeds : [],
          manualProtTarget: parsed.manualProtTarget !== undefined ? parsed.manualProtTarget : ''
        };
        saveState();
        renderApp();
        showToast('Tracker data imported successfully.');
      } catch (err) {
        showToast('That file is not a valid tracker JSON export.', true);
      }
    });
  }

  /* ==========================================================================
     9. Global Event Listeners (Delegated)
     ========================================================================== */
  document.getElementById('btn-prev-day').addEventListener('click', () => {
    curDate = shiftDate(curDate, -1);
    renderApp();
  });

  document.getElementById('btn-next-day').addEventListener('click', () => {
    curDate = shiftDate(curDate, 1);
    renderApp();
  });

  document.getElementById('date-input').addEventListener('change', (e) => {
    if (e.target.value) {
      curDate = e.target.value;
      renderApp();
    }
  });

  document.getElementById('btn-export-top').addEventListener('click', exportJSON);
  document.getElementById('import-file-top').addEventListener('change', (e) => {
    handleImportFile(e.target.files[0]);
    e.target.value = '';
  });

  document.getElementById('nav-tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    activeTab = btn.dataset.tab;
    renderApp();
  });

  /* Modal Buttons */
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('confirm-modal').addEventListener('click', (e) => {
    if (e.target.id === 'confirm-modal') closeModal();
  });
  document.getElementById('modal-confirm').addEventListener('click', () => {
    S = { days: {}, vit: [], gates: {}, phase: 1, customMeds: [], manualProtTarget: '' };
    saveState();
    closeModal();
    renderApp();
    showToast('All tracker data has been reset.');
  });

  /* Delegated Clicks inside Main Workspace */
  document.addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    const val = btn.dataset.val;
    const D = getDay(curDate);

    if (action === 'go-date') {
      curDate = val;
      renderApp();
      return;
    }
    if (action === 'jump-from-hm') {
      curDate = val;
      activeTab = 'exercise';
      renderApp();
      return;
    }
    if (action === 'set-phase') {
      S.phase = Number(val);
      saveState();
      renderApp();
      return;
    }
    if (action === 'toggle-ex') {
      D.ex[val] = !D.ex[val];
      saveState();
      renderApp();
      return;
    }
    if (action === 'adj-water') {
      D.water = Math.max(0, Math.round((D.water + Number(val)) * 100) / 100);
      saveState();
      renderApp();
      return;
    }
    if (action === 'adj-prot') {
      const currentTotal = getDayMacros(curDate).p;
      const delta = Number(val);
      if (currentTotal + delta < 0) {
        D.prot = -D.meals.reduce((s, m) => s + (Number(m.p) || 0), 0);
      } else {
        D.prot = (D.prot || 0) + delta;
      }
      saveState();
      renderApp();
      return;
    }
    if (action === 'add-preset') {
      const preset = MEAL_PRESETS[Number(val)];
      if (preset) {
        D.meals.push({ slot: selectedMealSlot, name: preset.name, p: preset.p, c: preset.c, f: preset.f });
        saveState();
        renderApp();
        showToast(`Added ${preset.name} (${selectedMealSlot})`);
      }
      return;
    }
    if (action === 'del-meal') {
      D.meals.splice(Number(val), 1);
      saveState();
      renderApp();
      return;
    }
    if (action === 'del-med') {
      S.customMeds = S.customMeds.filter(m => m.id !== val);
      saveState();
      renderApp();
      return;
    }
    if (action === 'save-vitals') {
      const numVal = (id) => {
        const el = document.getElementById(id);
        return (!el || el.value === '') ? null : Number(el.value);
      };
      const entry = {
        d: curDate,
        w: numVal('v-w'),
        wa: numVal('v-wa'),
        s: numVal('v-s'),
        di: numVal('v-di'),
        r: numVal('v-r')
      };
      S.vit = S.vit.filter(x => x.d !== curDate);
      if (entry.w != null || entry.wa != null || entry.s != null || entry.di != null || entry.r != null) {
        S.vit.push(entry);
        showToast('Vitals saved for ' + curDate);
      } else {
        showToast('Cleared empty vitals entry.');
      }
      saveState();
      renderApp();
      return;
    }
    if (action === 'export-json') {
      exportJSON();
      return;
    }
    if (action === 'open-reset-modal') {
      openModal();
      return;
    }
    if (action === 'timer-toggle') {
      if (T.iv) {
        clearInterval(T.iv);
        T.iv = null;
      } else {
        if (T.idx >= T.seq.length) buildTimer();
        playBeep();
        T.iv = setInterval(timerTick, 1000);
      }
      updateTimerDOM();
      return;
    }
    if (action === 'timer-skip') {
      if (T.idx < T.seq.length) {
        T.idx++;
        playBeep();
        if (T.idx >= T.seq.length) {
          clearInterval(T.iv);
          T.iv = null;
        } else {
          T.left = T.seq[T.idx][1];
        }
        updateTimerDOM();
      }
      return;
    }
    if (action === 'timer-reset') {
      clearInterval(T.iv);
      T.iv = null;
      buildTimer();
      updateTimerDOM();
      return;
    }
  });

  /* Delegated Change Events */
  document.addEventListener('change', (e) => {
    const t = e.target;
    const D = getDay(curDate);

    if (t.dataset.action === 'toggle-hab') {
      D.hab[t.dataset.val] = t.checked;
      saveState();
      renderApp();
      return;
    }
    if (t.dataset.action === 'toggle-sym') {
      D.sym[t.dataset.val] = t.checked;
      saveState();
      renderApp();
      return;
    }
    if (t.dataset.action === 'toggle-gate') {
      S.gates[t.dataset.val] = t.checked;
      saveState();
      renderApp();
      return;
    }
    if (t.id === 'timer-preset') {
      clearInterval(T.iv);
      T.iv = null;
      T.step = Number(t.value);
      buildTimer();
      updateTimerDOM();
      return;
    }
    if (t.id === 'preset-slot') {
      selectedMealSlot = t.value;
      const cmSlot = document.getElementById('cm-slot');
      if (cmSlot) cmSlot.value = selectedMealSlot;
      return;
    }
    if (t.id === 'manual-prot') {
      S.manualProtTarget = t.value === '' ? '' : Math.max(0, Number(t.value));
      saveState();
      renderApp();
      return;
    }
    if (t.id === 'import-file-panel') {
      handleImportFile(t.files[0]);
      t.value = '';
      return;
    }
  });

  /* Delegated Input Events (Textareas & Exercise Load Notes) */
  document.addEventListener('input', (e) => {
    const t = e.target;
    const D = getDay(curDate);
    if (t.dataset.field === 'note') {
      D.note = t.value;
      saveState();
    } else if (t.dataset.field === 'ex-weight') {
      D.weights[t.dataset.id] = t.value;
      saveState();
    }
  });

  /* Delegated Form Submissions (Custom Meals & Custom Meds) */
  document.addEventListener('submit', (e) => {
    if (e.target.id === 'custom-meal-form') {
      e.preventDefault();
      const slot = document.getElementById('cm-slot').value;
      const name = document.getElementById('cm-name').value.trim();
      const p = Number(document.getElementById('cm-p').value) || 0;
      const c = Number(document.getElementById('cm-c').value) || 0;
      const f = Number(document.getElementById('cm-f').value) || 0;
      if (!name) return;
      const D = getDay(curDate);
      D.meals.push({ slot, name, p, c, f });
      selectedMealSlot = slot;
      saveState();
      renderApp();
      showToast(`Logged ${name}`);
    } else if (e.target.id === 'custom-med-form') {
      e.preventDefault();
      const input = document.getElementById('new-med-name');
      const name = input.value.trim();
      if (!name) return;
      S.customMeds.push({ id: 'med_' + Date.now(), name });
      saveState();
      renderApp();
      showToast(`Added ${name} to daily supplements`);
    }
  });

  /* Initial Boot */
  buildTimer();
  renderApp();
})();
</script>
</body>
</html>
